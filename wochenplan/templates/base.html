<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}wochenplan.net{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">
                <span class="logo-icon">&#x1F4CB;</span>
                <span class="logo-text">wochenplan<span class="logo-dot">.net</span></span>
            </a>
            <p class="tagline">Dein Wochenplan. Weniger denken, besser essen.</p>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>wochenplan.net &ndash; Essensplanung ohne Stress</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
